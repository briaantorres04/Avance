<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c120e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alineación">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Evaluación de isométricos por alinear</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  /* PALETA MODO SOMBRA (Grafito / Bosque oscuro + Lima industrial) */
  --bg: #0c120e;
  --surface: #131a15;
  --surface-alt: #1a241e;
  --surface-elevated: #222e26;
  --border: #233128;
  --border-strong: #33463a;
  
  --tx-main: #f1f5f2;
  --tx-muted: #8b9e91;
  --tx-dim: #5c6d62;

  --accent: #d4f542;
  --accent-hover: #bde02f;
  --tx-on-accent: #0c120e;

  --ok: #4ade80;
  --ok-bg: rgba(74, 222, 128, 0.12);
  --wa: #facc15;
  --wa-bg: rgba(250, 204, 21, 0.12);
  --er: #f87171;
  --er-bg: rgba(248, 113, 113, 0.12);
  --bl: #38bdf8;
  --bl-bg: rgba(56, 189, 248, 0.12);

  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: Consolas, "SF Mono", "Roboto Mono", Monaco, monospace;

  color-scheme: dark;
}

:root[data-theme="light"] {
  /* PALETA MODO SOL (Alto contraste para obra bajo sol directo) */
  --bg: #eaedea;
  --surface: #ffffff;
  --surface-alt: #f1f4f0;
  --surface-elevated: #e2e7e1;
  --border: #cbd5cb;
  --border-strong: #94a395;

  --tx-main: #0c120e;
  --tx-muted: #4e5f53;
  --tx-dim: #798b7e;

  --accent: #111a14;
  --accent-hover: #233128;
  --tx-on-accent: #d4f542;

  --ok: #15803d;
  --ok-bg: #dcfce7;
  --wa: #a16207;
  --wa-bg: #fef9c3;
  --er: #b91c1c;
  --er-bg: #fee2e2;
  --bl: #0369a1;
  --bl-bg: #e0f2fe;

  color-scheme: light;
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx-main);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* HEADER EDITORIAL */
header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.brand h1 {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--tx-main);
  text-transform: uppercase;
}
.brand .sub {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  background: var(--surface-alt);
  padding: 2px 6px;
  border: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.nav-group {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--surface-alt);
  padding: 3px;
  border: 1px solid var(--border);
}
.nav-group button {
  background: transparent;
  border: none;
  color: var(--tx-muted);
  font-weight: 600;
  font-size: 12px;
  padding: 7px 14px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  transition: all 0.15s ease;
}
.nav-group button.on {
  background: var(--accent);
  color: var(--tx-on-accent);
}

.actions-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

button {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  cursor: pointer;
  padding: 8px 14px;
  border: 1px solid var(--border-strong);
  background: var(--surface-alt);
  color: var(--tx-main);
  border-radius: 0px;
  transition: all 0.15s ease;
}
button:hover { background: var(--surface-elevated); }
button.p {
  background: var(--accent);
  color: var(--tx-on-accent);
  border-color: var(--accent);
}
button.p:hover { background: var(--accent-hover); }

/* INDICADOR DE CAMBIOS NO RESPALDADOS */
.unsaved-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 900;
  background: var(--er);
  color: #fff;
}

input, select, textarea {
  font-family: var(--font-ui);
  font-size: 13px;
  background: var(--surface-alt);
  color: var(--tx-main);
  border: 1px solid var(--border);
  padding: 8px 10px;
  width: 100%;
  box-sizing: border-box;
  border-radius: 0;
}
input:focus, select:focus, textarea:focus {
  outline: 1px solid var(--accent);
  border-color: var(--accent);
}

/* COMPLEJIDAD SELECTOR SEGMENTADO */
.cmplx-group {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.cmplx-btn {
  flex: 1;
  padding: 8px 6px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--tx-muted);
}
.cmplx-btn.active[data-c="Baja"] { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.cmplx-btn.active[data-c="Media"] { background: var(--wa-bg); color: var(--wa); border-color: var(--wa); }
.cmplx-btn.active[data-c="Alta"] { background: var(--er-bg); color: var(--er); border-color: var(--er); }
.cmplx-btn.active[data-c="Crítica"] { background: var(--accent); color: var(--tx-on-accent); border-color: var(--accent); }

/* ORDENAMIENTO RAPIDO */
.sort-bar {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}
.sort-bar button {
  flex: 1;
  padding: 5px 6px;
  font-size: 10px;
}

/* LAYOUT PRINCIPAL */
main {
  padding: 16px 20px;
  max-width: 1380px;
  margin: auto;
}
.g {
  display: grid;
  grid-template-columns: minmax(320px, 380px) 1fr;
  gap: 16px;
  align-items: start;
}
@media (max-width: 860px) {
  .g { grid-template-columns: 1fr; }
}

.c {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 16px;
}

.li {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  background: var(--surface);
  transition: background 0.15s ease;
}
.li:hover { background: var(--surface-alt); }
.li.s {
  background: var(--surface-alt);
  border-left: 3px solid var(--accent);
}
.li b {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.li small {
  color: var(--tx-muted);
  font-size: 11px;
}
.l {
  max-height: 65vh;
  overflow-y: auto;
  border: 1px solid var(--border);
  margin-top: 10px;
}

.b {
  display: inline-block;
  padding: 3px 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  border: 1px solid currentColor;
}
.ok { color: var(--ok); background: var(--ok-bg); }
.wa { color: var(--wa); background: var(--wa-bg); }
.er { color: var(--er); background: var(--er-bg); }
.bl { color: var(--bl); background: var(--bl-bg); }
.mu { color: var(--tx-muted); }

.iso-header-box {
  background: var(--surface-alt);
  border: 1px solid var(--border-strong);
  margin-bottom: 16px;
}
.iso-title-row {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
}
.iso-title-row .code {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--tx-main);
}
.iso-stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
}
.iso-stat-cell {
  padding: 10px 14px;
  border-right: 1px solid var(--border);
}
.iso-stat-cell:last-child { border-right: none; }
.iso-stat-cell span {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--tx-muted);
  letter-spacing: 0.04em;
}
.iso-stat-cell b {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  color: var(--tx-main);
}

.q {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.01em;
  margin: 14px 0 6px;
  color: var(--tx-main);
}
.yn {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 14px 0;
}
.yn button {
  padding: 14px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.yn button:first-child {
  background: var(--accent);
  color: var(--tx-on-accent);
  border-color: var(--accent);
}
.yn button:first-child:hover { background: var(--accent-hover); }

.kp {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.kp .c {
  padding: 14px;
  border-top: 3px solid var(--border-strong);
}
.kp .c.ok { border-top-color: var(--ok); }
.kp .c.er { border-top-color: var(--er); }
.kp .c.wa { border-top-color: var(--wa); }
.kp .c.bl { border-top-color: var(--bl); }
.kp .c span {
  display: block;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--tx-muted);
}
.kp .c b {
  display: block;
  font-family: var(--font-mono);
  font-size: 32px;
  font-weight: 800;
  line-height: 1.1;
  margin-top: 6px;
  letter-spacing: -0.03em;
}

.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0;
}
.bar i {
  display: block;
  height: 12px;
  background: var(--accent);
  min-width: 2px;
}

/* BARRA DE META DIARIA */
.goal-track {
  width: 100%;
  height: 10px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  position: relative;
  margin-top: 6px;
}
.goal-fill-prog {
  height: 100%;
  background: var(--bl);
  opacity: 0.45;
  position: absolute;
  top: 0;
  left: 0;
}
.goal-fill-done {
  height: 100%;
  background: var(--accent);
  position: absolute;
  top: 0;
  left: 0;
}

.tw {
  overflow-x: auto;
  border: 1px solid var(--border);
  margin-top: 10px;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
}
th, td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  white-space: nowrap;
}
th {
  background: var(--surface-alt);
  color: var(--tx-muted);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.04em;
}
td { font-family: var(--font-mono); }
tr:hover td { background: var(--surface-alt); }

.f {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 10px 0;
}
.f > * { flex: 1 1 160px; }

details summary {
  cursor: pointer;
  padding: 8px 0;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>ALIN</h1>
    <span class="sub">Control de Isométricos</span>
  </div>

  <div class="nav-group">
    <button id="t1" class="on">Evaluar</button>
    <button id="t2">Dashboard</button>
    <button id="t3">Programa</button>
  </div>

  <div class="actions-group">
    <button id="th_btn" onclick="toggleTheme()">Modo Sol</button>
    <button id="ld">Cargar Avance</button>
    <button id="lsp">Cargar Soportes</button>
    <button id="ex_sp" onclick="exportarCSV()">Exportar CSV Soportes</button>
    <button id="im">Importar</button>
    <button id="ex" class="p">Guardar en Excel<span id="unsaved_cnt"></span></button>
    <input id="fi" type="file" accept=".xlsx,.xlsm,.xls,.csv" hidden>
  </div>
</header>

<div id="bx" class="c" style="display:none;position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:99;border:1px solid var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.6)"></div>

<main id="m"></main>

<script src="xlsx.full.min.js"></script>
<script>
let D=[],info='',pf='',sf='',AL=3,EQ=[],QD=[],pa=null,pd='',SP={},spi='',unsaved=0,metaDia=120,srt='pr',spOpen=false;
const K='evalAlin1';let S={},sup='';

function initTheme(){
  const saved = localStorage.getItem(K+'_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeBtn(saved);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', cur);
  localStorage.setItem(K+'_theme', cur);
  updateThemeBtn(cur);
}
function updateThemeBtn(theme){
  const b = $('th_btn');
  if(b) b.textContent = theme === 'light' ? 'Modo Sombra' : 'Modo Sol';
}

try{
  S=JSON.parse(localStorage.getItem(K)||'{}');
  sup=localStorage.getItem(K+'s')||'';
  D=JSON.parse(localStorage.getItem(K+'d')||'[]');
  info=localStorage.getItem(K+'i')||'';
  pf=localStorage.getItem(K+'p')||'';
  AL=+localStorage.getItem(K+'a')||3;
  EQ=JSON.parse(localStorage.getItem(K+'e')||'[]');
  QD=JSON.parse(localStorage.getItem(K+'q')||'[]');
  unsaved=+localStorage.getItem(K+'u')||0;
  metaDia=+localStorage.getItem(K+'m')||120;
  srt=localStorage.getItem(K+'srt')||'pr';
}catch(e){}

function updateUnsavedUI(){
  const el = $('unsaved_cnt');
  if(!el) return;
  el.innerHTML = unsaved > 0 ? '<span class="unsaved-badge">' + unsaved + '</span>' : '';
}

const sv=(markChange=true)=>{
  try{
    if(markChange){
      unsaved++;
      localStorage.setItem(K+'u', unsaved);
    }
    localStorage.setItem(K,JSON.stringify(S));
    localStorage.setItem(K+'s',sup);
    localStorage.setItem(K+'e',JSON.stringify(EQ));
    localStorage.setItem(K+'q',JSON.stringify(QD));
    updateUnsavedUI();
  }catch(e){}
};

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=i=>document.getElementById(i);
const ef=s=>s.est||s.res;
const hoy=()=>new Date().toLocaleDateString('en-CA');
const dEv=s=>Math.floor((Date.now()-new Date(s.fecha+'T00:00'))/864e5);
const m1=v=>(+v).toLocaleString('es-MX',{maximumFractionDigits:1});
function lg(s,t){s.hist=s.hist||[];s.hist.push(hoy()+' · '+(sup||'—')+' · '+t);s.fmod=hoy()}
const ld=s=>[s.fecha,s.ftrab,s.flib,s.fmod].filter(Boolean).map(String).sort().pop()||'';
const fl=r=>(!pf||r.pl===pf)&&(!sf||(S[r.iso]&&ef(S[r.iso])===sf))&&(flt==='all'||(flt==='pend'?!S[r.iso]:flt==='work'?(S[r.iso]&&S[r.iso].res==='Trabajable'&&!S[r.iso].est):!!S[r.iso]));

let tab='ev',cur=null,a=null,flt='pend',q='',msg='';
const dias=r=>Math.max(0,Math.floor((Date.now()-new Date(r.fm+'T00:00'))/864e5));
const FL={mont:['mont'],coord:['coord'],man:['man','mtipo'],sop:['sop'],mat:['mat'],desc:['desc'],plat:['plat'],and:['and'],nand:['nand','fsol'],otro:['otro']};

function getFilteredList(){
  const L = D.map((r,i)=>[r,i]).filter(([r])=>fl(r)&&r.iso.toLowerCase().includes(q.toLowerCase()));
  if(srt==='mt') L.sort((a,b)=>b[0].mt - a[0].mt);
  else if(srt==='dias') L.sort((a,b)=>dias(b[0]) - dias(a[0]));
  else L.sort((a,b)=>(a[0].pr+a[0].fm+a[0].iso).localeCompare(b[0].pr+b[0].fm+b[0].iso));
  return L;
}

function setSort(s){
  srt=s;
  try{localStorage.setItem(K+'srt',srt)}catch(e){}
  draw();
}

function nq(a){
 if(!a.mont)return'mont';
 if(a.mont==='No')return null;
 if(!a.coord)return'coord';
 if(a.coord==='No'&&!a.man)return'man';
 if(!a.sop)return'sop';
 if(a.sop==='Sí'){if(!a.mat)return'mat';if(a.mat==='No')return a.desc?null:'desc'}
 if(!a.plat)return'plat';
 if(a.plat==='Sí')return null;
 if(!a.and)return'and';
 if(a.and==='Sí')return a.nand>0?null:'nand';
 return a.otro?null:'otro';
}

function res(a){
 if(a.mont==='No')return'No alineable, Línea incompleta';
 if(a.sop==='Sí'&&a.mat==='No')return'No alineable por falta de material';
 if(a.plat==='Sí')return'Trabajable';
 if(a.and==='Sí')return a.fsol?'Pendiente por andamio':'Pendiente solicitud de andamio';
 return'Requiere otro medio de acceso';
}

const CL={'Trabajable':'ok','No alineable, Línea incompleta':'er','Trabajado':'bl','Liberado':'ok','No alineable por falta de material':'er','Pendiente por andamio':'wa','Pendiente solicitud de andamio':'wa','Requiere otro medio de acceso':'bl'};

const QT={
 mont:['¿El isométrico está montado completo?','Confirma en campo que todos sus spools estén montados. Si falta alguno, queda como No alineable, Línea incompleta.'],
 coord:['¿El isométrico está en coordenada?','Sí = ya no requiere ningún recurso extra, como maniobra manual o grúa.'],
 man:['¿Requiere maniobra?',''],
 sop:['¿Requiere instalar soporte?',''],
 mat:['¿El soporte está en sitio o se cuenta con material para fabricarlo?',''],
 plat:['¿Se puede realizar con plataforma o es a nivel de piso?',''],
 and:['¿Requiere andamio?','']
};

function ans(k,v){a[k]=v;a.h.push(k);draw()}
function back(){const k=a.h.pop();if(k)FL[k].forEach(f=>delete a[f]);draw()}
function nw(){a={h:[],cmplx:(S[cur.iso]&&S[cur.iso].cmplx)||'Media'};draw()}
function pick(i){cur=D[i];a=S[cur.iso]?null:{h:[],cmplx:'Media'};msg='';draw()}

function setCmplx(val){
 if(a){ a.cmplx=val; draw(); }
 else if(cur && S[cur.iso]){
   S[cur.iso].cmplx=val;
   lg(S[cur.iso],'Complejidad cambiada a '+val);
   sv(); draw();
 }
}

function addSopFaltante(btn){
  const t=$('f_desc');
  if(!t)return;
  const val=btn.dataset.s;
  if(t.value.includes(val))return;
  t.value = (t.value.trim() ? t.value.trim() + ', ' : '') + val;
}

function done(k,fields){
 for(const f of fields){const v=$('f_'+f).value.trim();if(v)a[f]=v;else if(f!=='fsol'&&f!=='mtipo'){return}}
 if(k==='nand'&&!(+a.nand>0)){delete a.nand;return}
 a.h.push(k);draw();
}

function est(k){
 const s=S[cur.iso],t=hoy(),e=m=>{msg=m;draw()};
 if(!sup)return e('Escribe el nombre de supervisor.');
 if(k==='Trabajado'){
   if(s.res!=='Trabajable')return e('Solo se puede marcar Trabajado si el resultado es Trabajable.');
   s.est='Trabajado';s.ftrab=t;delete s.flib;
 } else if(k==='Liberado'){
   if(!s.est)return e('Primero marca el isométrico como Trabajado.');
   s.est='Liberado';s.flib=t;
 } else if(s.est==='Liberado'){
   s.est='Trabajado';delete s.flib;
 } else {
   delete s.est;delete s.ftrab;
   if(s.pest==='Terminada')s.pest='En proceso';
 }
 lg(s,k==='back'?'Avance retrocedido':'Marcado '+k);
 sv();msg='Estatus actualizado.';draw();
}

function cic(k){
 const s=S[cur.iso],e=m=>{msg=m;draw()};
 if(!sup)return e('Escribe el nombre de supervisor.');

}

function csv(t){
 const R=[];let r=[],f='',q=false;t=t.replace(/^\ufeff/,'');
 for(let i=0;i<t.length;i++){
   const c=t[i];
   if(q){
     if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c;
   } else if(c==='"')q=true;
   else if(c===','){r.push(f);f=''}
   else if(c==='\n'||c==='\r'){
     if(c==='\r'&&t[i+1]==='\n')i++;
     r.push(f);f='';R.push(r);r=[];
   } else f+=c;
 }
 if(f||r.length){r.push(f);R.push(r)}
 return R;
}

const idb=(m,v)=>new Promise((ok,no)=>{
 const q=indexedDB.open('alinSop',1);
 q.onupgradeneeded=()=>q.result.createObjectStore('kv');
 q.onsuccess=()=>{
   const db=q.result,tx=db.transaction('kv',m==='g'?'readonly':'readwrite'),st=tx.objectStore('kv'),rq=m==='g'?st.get('sp'):st.put(v,'sp');
   tx.oncomplete=()=>ok(rq.result);tx.onerror=()=>no(tx.error);
 };
 q.onerror=()=>no(q.error);
});

const EXC=['5S1','5S2','5LP','5DS2','5DS1','5ST','5DA1C','5DA2C','5DA3C'],isEx=c=>EXC.some(p=>String(c).toUpperCase().startsWith(p));
const crOf=r=>r.cr||String(r.iso).replace(/^[A-Z]+-\d+-\d+-K-/,'');
function spOf(iso){const r=D.find(x=>x.iso===iso);return SP[r?crOf(r):String(iso).replace(/^[A-Z]+-\d+-\d+-K-/,'')]||null}
const relS=a=>a.filter(x=>!(x[10]&&isEx(x[0]))),okS=x=>x[2]==='Instalado'||x[2]==='Liberado',pendS=a=>relS(a).filter(x=>!okS(x));

function sres(a){
 const r=relS(a),c=e=>r.filter(x=>x[2]===e).length;
 return{n:r.length,i:c('Instalado'),l:c('Liberado'),r:c('Rechazado'),p:c('Pendiente'),conRec:r.filter(x=>x[2]==='Pendiente'&&x[7]).length};
}

function sdesc(x){
 const f=x[3]+'/'+x[4]+' pzas';
 if(okS(x))return f+(x[6]?' · '+x[6]:'')+(x[5]?' · '+x[5]:'');
 if(x[2]==='Rechazado')return'Rechazado (requiere reinstalación)'+(x[9]?' · '+x[9]:'');
 return(x[10]?'Sin reporte en checklist':'Pendiente')+' · Material '+(x[7]?'recibido '+x[7]:'sin fecha de recepción')+(x[8]?' · prog. '+x[8]:'')+(x[9]?' · '+x[9]:'');
}

function soportes(t,name){
 const R=csv(t),H=R[0]||[],ix=n=>H.indexOf(n);
 if(ix('Isometrico')<0||ix('Soporte')<0||ix('Estado')<0){alert('El archivo no contiene las columnas requeridas (Isometrico, Soporte, Estado).');return}
 const o={};
 for(const r of R.slice(1)){
   const i=r[ix('Isometrico')];if(!i)continue;const ob=r[ix('Observaciones')]||'';
   (o[i]=o[i]||[]).push([r[ix('Soporte')],r[ix('Descripcion')],r[ix('Estado')],+r[ix('Cantidad completada')]||0,+r[ix('Cantidad total')]||1,r[ix('Responsable')],r[ix('Fecha liberacion')],(ob.match(/Recibido:\s*(\d{4}-\d{2}-\d{2})/)||[])[1]||'',(ob.match(/Sem\. programada:\s*(\S+)/)||[])[1]||'',ob.replace(/\|?\s*Sem\. programada:\s*\S+/,'').replace(/\|?\s*Recibido:\s*\S+/,'').replace(/^[\s|]+|[\s|]+$/g,'').slice(0,110),!r[ix('Ultima actualizacion')]]);
 }
 for(const k of sched()){const z=S[k];if(!z.sp0){const a0=spOf(k);if(a0)z.sp0=pendS(a0).map(y=>y[0])}}
 SP=o;sv(false);spi='Checklist: '+name+' · '+hoy();
 idb('s',{d:SP,i:spi}).catch(()=>alert('Cargados en memoria local temporal.'));
 const n=Object.values(SP).reduce((a,b)=>a+b.length,0);cur=null;draw();
 alert(n+' soportes de '+Object.keys(SP).length+' isométricos importados.');
}

function exportarCSV(){
  if(!Object.keys(SP).length){alert('No hay datos de soportes cargados para exportar.');return}
  const cols = ['Isometrico','Soporte','Descripcion','Estado','Cantidad completada','Cantidad total','Responsable','Fecha liberacion','Observaciones','Ultima actualizacion'];
  const escCSV = v => {
    const s = String(v == null ? '' : v);
    return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [cols.join(',')];
  for(const iso of Object.keys(SP)){
    for(const x of SP[iso]){
      const obsParts = [];
      if(x[7]) obsParts.push('Recibido: ' + x[7]);
      if(x[8]) obsParts.push('Sem. programada: ' + x[8]);
      if(x[9]) obsParts.push(x[9]);
      const obs = obsParts.join(' | ');
      const row = [
        iso, x[0], x[1], x[2],
        x[2]==='Instalado'||x[2]==='Liberado' ? x[4] : x[3],
        x[4], x[5]||(sup||''), x[6]||'', obs, x[10] ? '' : hoy()
      ];
      lines.push(row.map(escCSV).join(','));
    }
  }
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const name = 'Checklist_Soportes_Actualizado_' + hoy() + '.csv';
  const url = URL.createObjectURL(blob);
  const aEl = document.createElement('a');
  aEl.href = url;
  aEl.download = name;
  document.body.appendChild(aEl);
  aEl.click();
  document.body.removeChild(aEl);
}

function cambiarEstSoporte(iso, codSop, nuevoEstado) {
  const r = D.find(x => x.iso === iso);
  const k = r ? crOf(r) : String(iso).replace(/^[A-Z]+-\d+-\d+-K-/, '');
  const list = SP[k];
  if (!list) return;

  const item = list.find(x => x[0] === codSop);
  if (!item) return;

  if (nuevoEstado === 'Rechazado') {
    const seguro = confirm('¿Confirmas marcar como RECHAZADO el soporte ' + codSop + '?\nRequerirá reinstalación.');
    if (!seguro) {
      spOpen = true;
      draw();
      return;
    }
    const motivo = prompt('Motivo del rechazo para ' + codSop + ' (opcional):', '');
    if (motivo && motivo.trim()) {
      item[9] = motivo.trim();
    }
  }

  item[2] = nuevoEstado;
  item[10] = false;
  if (nuevoEstado === 'Liberado' || nuevoEstado === 'Instalado') {
    item[6] = hoy();
    item[3] = item[4];
    if(sup) item[5] = sup;
  }

  spOpen = true;
  sv();
  idb('s', { d: SP, i: spi }).catch(() => {});
  
  if (S[iso]) {
    lg(S[iso], 'Soporte ' + codSop + ' marcado como ' + nuevoEstado + (item[9] ? ': ' + item[9] : ''));
  }
  
  draw();
}

function exc(i,c){
 const s=S[i];s.exc=s.exc||{};
 if(s.exc[c]){delete s.exc[c];lg(s,'Excepción retirada: soporte '+c)}
 else{
   const m=prompt('Motivo de la excepción para el soporte '+c+':');
   if(!m||!m.trim())return;
   s.exc[c]={m:m.trim(),f:hoy()};
   lg(s,'Excepción soporte '+c+': '+m.trim());
 }
 spOpen=true;sv();draw();
}

function alertas(){
 const o=[];
 for(const k of sched()){
   const a=spOf(k);if(!a)continue;const s=S[k],ex=s.exc||{},cr=s.cerr||{},cods=new Set([...(s.sp0||pendS(a).map(x=>x[0])),...Object.keys(ex)]);
   for(const x of a){
     const e=ex[x[0]];
     if(!cods.has(x[0])||cr[x[0]]||!(e||s.pfecha<hoy()))continue;
     o.push({iso:k,c:x[0],d:x[1],est:x[2],ok:okS(x),inst:x[6],exc:e,rec:x[7],dias:Math.max(0,Math.floor((Date.now()-new Date((e?e.f:s.pfecha)+'T00:00'))/864e5))});
   }
 }
 return o.sort((p,q)=>(q.exc?1:0)-(p.exc?1:0)||q.dias-p.dias);
}

function cargar(buf,name){
 const w=XLSX.read(buf,{type:'array',cellDates:true}),sn=w.SheetNames.find(n=>/alineaci/i.test(n))||w.SheetNames[0];
 const A=XLSX.utils.sheet_to_json(w.Sheets[sn],{header:1,raw:true,defval:null}),hi=A.findIndex(r=>r&&r.includes('Isometrico')&&r.includes('Fecha de Montaje'));
 if(hi<0){alert('Columnas requeridas no encontradas (Isometrico, Fecha de Montaje) en la hoja Alineacion.');return}
 const c=n=>A[hi].indexOf(n),ci={k:c('Iso - Cruce'),i:c('Isometrico'),p:c('Planta'),u:c('Unidad'),m:c('Mts'),r:c('Prioridad Base Iso'),fm:c('Fecha de Montaje'),fa:c('Fecha Alineacion')},T={};
 
 for(const r of A.slice(hi+1)){
   const k=r[ci.i];if(!has(k))continue;
   const t=T[k]||(T[k]={cr:r[ci.k],n:0,m:0,a:0,mt:0,fm:'',pl:r[ci.p],un:String(r[ci.u]),pr:r[ci.r]});
   t.n++;if(has(r[ci.fm])){t.m++;const d=ISO(r[ci.fm]);if(d>t.fm)t.fm=d}if(has(r[ci.fa]))t.a++;if(typeof r[ci.m]==='number')t.mt+=r[ci.m];
 }
 D=Object.keys(T).filter(k=>T[k].n===T[k].m&&T[k].a===0&&T[k].mt>6).map(k=>({iso:k,cr:T[k].cr,pl:T[k].pl,un:T[k].un,pr:T[k].pr,sp:T[k].n,mt:Math.round(T[k].mt*10)/10,fm:T[k].fm})).sort((x,y)=>(x.pr+x.fm+x.iso).localeCompare(y.pr+y.fm+y.iso));
 info='Avance: '+name;
 try{localStorage.setItem(K+'d',JSON.stringify(D));localStorage.setItem(K+'i',info)}catch(e){}
 cur=null;a=null;msg='';tab='ev';draw();
 alert(D.length+' isométricos cargados exitosamente.');
}

function importar(buf){
 const W=XLSX.read(buf,{type:'array'}),s=W.Sheets['Evaluaciones'];
 if(!s){alert('Hoja "Evaluaciones" no encontrada en el archivo.');return}
 const A=XLSX.utils.sheet_to_json(s,{header:1,defval:''});let n=0;
 const hRow=A[0]||[],cIx=hRow.indexOf('Complejidad');
 for(const r of A.slice(1)){
   const k=r[0];if(!k)continue;
   const rRes = cIx>0 ? r[8] : r[7];
   if(!rRes||rRes==='Sin evaluar')continue;
   const o=S[k];
   const off = cIx>0 ? 1 : 0;
   if(o&&ld(o)>=ld({fecha:r[20+off],ftrab:r[23+off],flib:r[24+off],fmod:r[28+off]}))continue;
   const e={h:[],res:rRes,cmplx:(cIx>0?r[cIx]:'')||'Media',coord:r[8+off],man:r[9+off],mtipo:r[10+off],sop:r[11+off],mat:r[12+off],desc:r[13+off],plat:r[14+off],and:r[15+off],nand:r[16+off],fsol:r[17+off],otro:r[18+off],sup:r[19+off],fecha:String(r[20+off]),pl:r[1],un:r[2],pr:r[3],sp:r[4+off],mt:r[5+off],est:r[22+off],ftrab:r[23+off],flib:r[24+off],mont:r[25+off],nota:r[26+off],hist:r[27+off]?String(r[27+off]).split(' | '):[],fmod:r[28+off]};
   Object.keys(e).forEach(f=>{if(e[f]==='')delete e[f]});S[k]=e;n++;
 }
 const rd=nm=>W.Sheets[nm]?XLSX.utils.sheet_to_json(W.Sheets[nm],{header:1,defval:''}).slice(1):[];
 rd('Equipos').forEach(r=>{if(r[1]&&!EQ.some(e=>e.nom===r[1]))EQ.push({id:r[0]||'e'+Date.now()+EQ.length,nom:r[1],tipo:r[2],alt:r[3],est:r[4]||'Disponible'})});
 rd('Cuadrillas').forEach(r=>{if(r[1]&&!QD.some(q=>q.nom===r[1]))QD.push({id:r[0]||'q'+Date.now()+QD.length,nom:r[1],turno:r[2],n:r[3]})});
 rd('Programa').forEach(r=>{const x=S[r[3]];if(x&&r[0]){x.pfecha=String(r[0]);x.pest=r[8]||r[7]||'Programada';if(r[1])x.pcuad=r[1];if(r[9]||r[8])x.pnota=r[9]||r[8];const e=EQ.find(q=>q.nom===r[2]);if(e)x.peq=e.id}});
 rd('Excepciones').forEach(r=>{const x=S[r[0]];if(x&&r[1]){x.exc=x.exc||{};x.exc[r[1]]={m:r[2],f:String(r[3])}}});
 rd('Alertas cerradas').forEach(r=>{const x=S[r[0]];if(x&&r[1]){x.cerr=x.cerr||{};x.cerr[r[1]]={f:String(r[2]),n:r[3]||''}}});
 rd('Soportes asignados').forEach(r=>{const x=S[r[0]];if(x&&r[1]){x.sp0=x.sp0||[];if(!x.sp0.includes(r[1]))x.sp0.push(r[1])}});
 sv(false);draw();alert(n+' evaluaciones importadas.');
}
