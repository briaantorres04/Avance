<button id="t1" class="on">Evaluar</button><button id="t2">Dashboard</button><button id="ld">Cargar avance</button><button id="im">Importar</button><button id="ex" class="p">Guardar en Excel</button><input id="fi" type="file" accept=".xlsx,.xlsm,.xls" hidden></header>
<div id="bx" class="c" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;box-shadow:0 4px 18px rgba(0,0,0,.35)"></div>

<script>
let D=[],info='',pf='';
const K='evalAlin1';let S={},sup='';
try{S=JSON.parse(localStorage.getItem(K)||'{}');sup=localStorage.getItem(K+'s')||'';D=JSON.parse(localStorage.getItem(K+'d')||'[]');info=localStorage.getItem(K+'i')||'';pf=localStorage.getItem(K+'p')||''}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(K+'s',sup)}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=i=>document.getElementById(i);
const ef=s=>s.est||s.res;
const ld=s=>[s.fecha,s.ftrab,s.flib].filter(Boolean).map(String).sort().pop()||'';
const fl=r=>(!pf||r.pl===pf)&&(flt==='all'||(flt==='pend'?!S[r.iso]:flt==='work'?(S[r.iso]&&S[r.iso].res==='Trabajable'&&!S[r.iso].est):!!S[r.iso]));
let tab='ev',cur=null,a=null,flt='pend',q='',msg='';
const dias=r=>Math.max(0,Math.floor((Date.now()-new Date(r.fm+'T00:00'))/864e5));
const FL={mont:['mont'],coord:['coord'],man:['man','mtipo'],sop:['sop'],mat:['mat'],desc:['desc'],plat:['plat'],and:['and'],nand:['nand','fsol'],otro:['otro']};
function nq(a){
 if(!a.mont)return'mont';
 if(a.mont==='No')return null;
 if(!a.coord)return'coord';
 if(a.coord==='No'&&!a.man)return'man';
 if(!a.sop)return'sop';
 if(a.sop==='Sí'){if(!a.mat)return'mat';if(a.mat==='No')return a.desc?null:'desc'}
 if(!a.plat)return'plat';
 if(a.plat==='Sí')return null;
 if(!a.and)return'and';
 if(a.and==='Sí')return a.nand>0?null:'nand';
 return a.otro?null:'otro'}
function res(a){
 if(a.mont==='No')return'No alineable, Línea incompleta';
 if(a.sop==='Sí'&&a.mat==='No')return'No alineable por falta de material';
 if(a.plat==='Sí')return'Trabajable';
 if(a.and==='Sí')return a.fsol?'Pendiente por andamio':'Pendiente solicitud de andamio';
 return'Requiere otro medio de acceso'}
const CL={'Trabajable':'ok','No alineable, Línea incompleta':'er','Trabajado':'bl','Liberado':'ok','No alineable por falta de material':'er','Pendiente por andamio':'wa','Pendiente solicitud de andamio':'wa','Requiere otro medio de acceso':'bl'};
const QT={mont:['¿El isométrico está montado completo?','Confirma en campo que todos sus spools estén montados. Si falta alguno, queda como No alineable, Línea incompleta.'],coord:['¿El isométrico está en coordenada?','Sí = ya no requiere ningún recurso extra, como maniobra manual o grúa.'],
 man:['¿Requiere maniobra?',''],sop:['¿Requiere instalar soporte?',''],
 mat:['¿El soporte está en sitio o se cuenta con material para fabricarlo?',''],
 plat:['¿Se puede realizar con plataforma o es a nivel de piso?',''],and:['¿Requiere andamio?','']};
function ans(k,v){a[k]=v;a.h.push(k);draw()}
function back(){const k=a.h.pop();if(k)FL[k].forEach(f=>delete a[f]);draw()}
function nw(){a={h:[]};draw()}
function pick(i){cur=D[i];a=S[cur.iso]?null:{h:[]};msg='';draw()}
function done(k,fields){
 for(const f of fields){const v=$('f_'+f).value.trim();if(v)a[f]=v;else if(f!=='fsol'&&f!=='mtipo'){return}}
 if(k==='nand'&&!(+a.nand>0)){delete a.nand;return}
 a.h.push(k);draw()}
function est(k){const s=S[cur.iso],t=new Date().toLocaleDateString('en-CA'),e=m=>{msg='⚠ '+m;draw()};
 if(!sup)return e('Escribe tu nombre de supervisor.');
 if(k==='Trabajado'){if(s.res!=='Trabajable')return e('Solo se puede marcar Trabajado si el resultado es Trabajable. Reevalúa cuando ya tenga material o andamio.');s.est='Trabajado';s.ftrab=t;delete s.flib}
 else if(k==='Liberado'){if(!s.est)return e('Primero marca el isométrico como Trabajado.');s.est='Liberado';s.flib=t}
 else if(s.est==='Liberado'){s.est='Trabajado';delete s.flib}else{delete s.est;delete s.ftrab}
 sv();msg='Estatus actualizado.';draw()}
function guardar(){
 if(!sup){msg='⚠ Escribe tu nombre de supervisor.';draw();return}
 const r=res(a);S[cur.iso]={...a,res:r,sup,fecha:new Date().toLocaleDateString('en-CA'),pl:cur.pl,un:cur.un,pr:cur.pr,sp:cur.sp,mt:cur.mt};sv();a=null;msg='Evaluación guardada.';draw()}
function panel(){
 if(!cur)return'<div class="c mu">'+(D.length?'Elige un isométrico de la lista. Solo aparecen los que están al 100 % de montaje, sin alineación y con más de 6 m.':'Aún no hay datos. Toca “Cargar avance” y elige el Excel del avance de montaje (hoja “Alineacion”). Se hace una vez con internet o con el archivo ya descargado; después funciona sin conexión.')+'</div>';
 let h='<div class="c"><b>'+esc(cur.iso)+'</b><div class="mu">'+esc(cur.pl)+' · Unidad '+esc(cur.un)+' · '+esc(cur.pr)+' · '+cur.sp+' spools · '+cur.mt+' m · '+dias(cur)+' días desde el último montaje</div>';
 h+='<div class="f"><div><small class="mu">Supervisor</small><input id="sup" value="'+esc(sup)+'" placeholder="Nombre" oninput="sup=this.value;sv()"></div></div>';
 if(msg)h+='<p class="'+(msg[0]==='⚠'?'er':'ok')+'">'+esc(msg)+'</p>';
 const s=S[cur.iso];
 if(s&&!a){h+='<div class="q"><span class="b '+CL[ef(s)]+'">'+esc(ef(s))+'</span></div><p class="mu">Evaluado por '+esc(s.sup)+' el '+s.fecha+'.</p>'+det(s)+'<div class="yn" style="flex-wrap:wrap"><button onclick="est(\'Trabajado\')">Marcar Trabajado</button><button onclick="est(\'Liberado\')">Marcar Liberado</button>'+(s.est?'<button onclick="est(\'back\')">Quitar avance</button>':'')+'</div><button class="p" onclick="nw()">Reevaluar</button>';return h+'</div>'}
 const k=nq(a);
 if(k===null){const r=res(a);h+='<div class="q">Resultado</div><span class="b '+CL[r]+'" style="font-size:15px">'+esc(r)+'</span>'+det(a)+'<div class="yn"><button onclick="back()">Atrás</button><button class="p" onclick="guardar()">Guardar evaluación</button></div>'}
 else if(QT[k]){
  h+='<div class="q">'+QT[k][0]+'</div><div class="mu">'+QT[k][1]+'</div>';
  if(k==='man')h+='<div class="f"><div><small class="mu">Tipo de maniobra (opcional)</small><select id="f_mtipo"><option></option><option>Manual</option><option>Grúa</option><option>Manual y grúa</option></select></div></div>';
  h+='<div class="yn"><button onclick="'+(k==='man'?'a.mtipo=$(\'f_mtipo\').value;':'')+'ans(\''+k+'\',\'Sí\')">Sí</button><button onclick="'+(k==='man'?'a.mtipo=$(\'f_mtipo\').value;':'')+'ans(\''+k+'\',\'No\')">No</button></div>'+(a.h.length?'<button onclick="back()">Atrás</button>':'')}
 else if(k==='desc')h+='<div class="q">Describe el soporte que falta</div><textarea id="f_desc" rows="3" placeholder="Tipo de soporte, cantidad, material faltante"></textarea><div class="yn"><button onclick="back()">Atrás</button><button class="p" onclick="done(\'desc\',[\'desc\'])">Continuar</button></div>';
 else if(k==='nand')h+='<div class="q">Datos del andamio</div><div class="f"><div><small class="mu">¿Cuántos andamios se requieren?</small><input id="f_nand" type="number" min="1" step="1"></div><div><small class="mu">Fecha de solicitud (vacía = pendiente de solicitar)</small><input id="f_fsol" type="date"></div></div><div class="yn"><button onclick="back()">Atrás</button><button class="p" onclick="done(\'nand\',[\'nand\',\'fsol\'])">Continuar</button></div>';
 else h+='<div class="q">Describe el medio de acceso requerido</div><textarea id="f_otro" rows="3" placeholder="Ej. canastilla, grúa con canasta, escalera especial"></textarea><div class="yn"><button onclick="back()">Atrás</button><button class="p" onclick="done(\'otro\',[\'otro\'])">Continuar</button></div>';
 return h+'</div>'}
function det(s){const r=[['Montado completo',s.mont],['En coordenada',s.coord],['Maniobra',s.man?(s.man+(s.mtipo?' ('+s.mtipo+')':'')):'—'],['Requiere soporte',s.sop],['Soporte / material',s.mat||'—'],['Descripción del soporte',s.desc||'—'],['Plataforma o nivel de piso',s.plat||'—'],['Andamio',s.and?(s.and+(s.nand?' · '+s.nand+' pza(s)':'')+(s.fsol?' · solicitado '+s.fsol:'')):'—'],['Otro medio de acceso',s.otro||'—'],['Fecha trabajado',s.ftrab],['Fecha liberado',s.flib]];
 return'<div class="tw"><table>'+r.map(x=>'<tr><th>'+x[0]+'</th><td style="white-space:normal">'+esc(x[1]||'—')+'</td></tr>').join('')+'</table></div>'}
function lista(){
 const L=D.map((r,i)=>[r,i]).filter(([r])=>fl(r)&&r.iso.toLowerCase().includes(q.toLowerCase()));
 return'<div class="c"><select id="pf" style="margin-bottom:8px" onchange="pf=this.value;try{localStorage.setItem(K+\'p\',pf)}catch(e){}draw()"><option value="">Todas las plantas</option>'+[...new Set(D.map(r=>r.pl))].sort().map(p=>'<option'+(p===pf?' selected':'')+'>'+esc(p)+'</option>').join('')+'</select><input id="q" placeholder="Buscar isométrico" value="'+esc(q)+'" oninput="q=this.value;lst()"><div class="f" style="margin:8px 0 0"><button class="'+(flt==='pend'?'on':'')+'" onclick="flt=\'pend\';draw()">Sin evaluar</button><button class="'+(flt==='done'?'on':'')+'" onclick="flt=\'done\';draw()">Evaluados</button><button class="'+(flt==='work'?'on':'')+'" onclick="flt=\'work\';draw()">Por trabajar</button><button class="'+(flt==='all'?'on':'')+'" onclick="flt=\'all\';draw()">Todos</button></div><div class="mu" style="margin-top:6px">'+L.length+' isométricos'+(info?' · '+esc(info):'')+'</div><div class="l" id="ls">'+rows(L)+'</div></div>'}
function rows(L){return L.slice(0,300).map(([r,i])=>{const s=S[r.iso];return'<div class="li'+(cur&&cur.iso===r.iso?' s':'')+'" onclick="pick('+i+')"><b>'+esc(r.iso)+'</b><br><small>'+esc(r.pr)+' · '+r.mt+' m · '+dias(r)+' d'+(s?' · <span class="'+CL[ef(s)]+'">'+esc(ef(s))+'</span>':'')+'</small></div>'}).join('')}
function lst(){const L=D.map((r,i)=>[r,i]).filter(([r])=>fl(r)&&r.iso.toLowerCase().includes(q.toLowerCase()));$('ls').innerHTML=rows(L)}
const V=()=>D.filter(r=>!pf||r.pl===pf);
function dash(){
 const ev=V().filter(r=>S[r.iso]),R=Object.keys(CL),n=k=>ev.filter(r=>ef(S[r.iso])===k).length,tot=V().length;
 const pa=ev.filter(r=>S[r.iso].and==='Sí'&&S[r.iso].plat==='No').reduce((s,r)=>s+(+S[r.iso].nand||0),0);
 let h='<p class="mu">'+(pf?'Planta '+esc(pf):'Todas las plantas')+' · el filtro se cambia en la pestaña Evaluar</p><div class="kp"><div class="c"><span class="mu">Elegibles</span><b>'+tot+'</b></div><div class="c"><span class="mu">Evaluados</span><b>'+ev.length+'</b>'+Math.round(100*ev.length/(tot||1))+' %</div><div class="c"><span class="mu">Sin evaluar</span><b>'+(tot-ev.length)+'</b></div><div class="c ok"><span class="mu">Por trabajar</span><b>'+n('Trabajable')+'</b></div><div class="c er"><span class="mu">Sin material</span><b>'+n('No alineable por falta de material')+'</b></div><div class="c er"><span class="mu">Línea incompleta</span><b>'+n('No alineable, Línea incompleta')+'</b></div><div class="c wa"><span class="mu">Andamios requeridos</span><b>'+pa+'</b></div><div class="c bl"><span class="mu">Trabajados</span><b>'+n('Trabajado')+'</b></div><div class="c ok"><span class="mu">Liberados</span><b>'+n('Liberado')+'</b></div></div>';
 const mx=Math.max(1,...R.map(n));
 h+='<div class="c"><b>Resultado de las evaluaciones</b>'+R.map(k=>'<div class="bar '+CL[k]+'"><span style="width:230px;color:var(--tx)">'+k+'</span><i style="width:'+(n(k)/mx*45)+'%"></i><b style="color:var(--tx)">'+n(k)+'</b></div>').join('')+'</div>';
 const P=[...new Set(V().map(r=>r.pr))].sort();
 h+='<div class="c" style="margin-top:14px"><b>Por prioridad</b><div class="tw"><table><tr><th>Prioridad</th><th>Elegibles</th><th>Evaluados</th>'+R.map(k=>'<th>'+k+'</th>').join('')+'</tr>'+P.map(p=>{const x=V().filter(r=>r.pr===p),e=x.filter(r=>S[r.iso]);return'<tr><td>'+p+'</td><td>'+x.length+'</td><td>'+e.length+'</td>'+R.map(k=>'<td>'+e.filter(r=>ef(S[r.iso])===k).length+'</td>').join('')+'</tr>'}).join('')+'</table></div></div>';
 const mat=ev.filter(r=>S[r.iso].res==='No alineable por falta de material'),and=ev.filter(r=>S[r.iso].res==='Pendiente por andamio'||S[r.iso].res==='Pendiente solicitud de andamio');
 h+='<div class="c" style="margin-top:14px"><b>Soportes por conseguir</b>'+(mat.length?'<div class="tw"><table><tr><th>Isométrico</th><th>Descripción</th></tr>'+mat.map(r=>'<tr><td>'+esc(r.iso)+'</td><td style="white-space:normal">'+esc(S[r.iso].desc)+'</td></tr>').join('')+'</table></div>':'<p class="mu">Sin casos.</p>')+'</div>';
 h+='<div class="c" style="margin-top:14px"><b>Andamios pendientes</b>'+(and.length?'<div class="tw"><table><tr><th>Isométrico</th><th>Andamios</th><th>Status</th><th>Fecha de solicitud</th></tr>'+and.map(r=>{const s=S[r.iso];return'<tr><td>'+esc(r.iso)+'</td><td>'+esc(s.nand)+'</td><td>'+esc(ef(s))+'</td><td>'+(s.fsol||'—')+'</td></tr>'}).join('')+'</table></div>':'<p class="mu">Sin casos.</p>')+'</div>';
 return h}
function draw(){$('t1').className=tab==='ev'?'on':'';$('t2').className=tab==='db'?'on':'';
 $('m').innerHTML=tab==='ev'?'<div class="g">'+lista()+'<div>'+panel()+'</div></div>':dash()}
$('t1').onclick=()=>{tab='ev';draw()};$('t2').onclick=()=>{tab='db';draw()};
let mode='L';
const ISO=x=>x instanceof Date?x.toISOString().slice(0,10):typeof x==='number'?new Date(Math.round((x-25569)*864e5)).toISOString().slice(0,10):String(x).slice(0,10);
const has=v=>v!=null&&String(v).trim()!=='';
function guarda(buf,name){const t='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',b=new Blob([buf],{type:t}),u=URL.createObjectURL(b),x=$('bx'),L='style="color:var(--ac);font-weight:700;margin-right:14px"';
 let f=null;try{const g=new File([b],name,{type:t});if(navigator.canShare&&navigator.canShare({files:[g]}))f=g}catch(e){}
 x.innerHTML='<b>Excel generado</b> ('+esc(name)+')<div style="margin-top:8px"><a '+L+' href="'+u+'" download="'+esc(name)+'">Descargar</a>'+(f?'<a '+L+' href="#" id="shr">Compartir</a>':'')+'<a '+L+' href="#" id="cl">Cerrar</a></div>';x.style.display='block';
 if(f)$('shr').onclick=e=>{e.preventDefault();navigator.share({files:[f]}).catch(()=>{})};
 $('cl').onclick=e=>{e.preventDefault();x.style.display='none'}}
$('ex').onclick=()=>{
 const R=Object.keys(CL),H=['Isométrico','Planta','Unidad','Prioridad','Spools','Metros','Días desde último montaje','Resultado','En coordenada','Requiere maniobra','Tipo de maniobra','Requiere soporte','Soporte en sitio o con material','Descripción del soporte','Plataforma o nivel de piso','Requiere andamio','Núm. de andamios','Fecha solicitud de andamio','Otro medio de acceso','Supervisor','Fecha de evaluación','Nota','Avance','Fecha trabajado','Fecha liberado','Montado completo'];
 const U=[...V().map(r=>[r,S[r.iso]||{},'']),...Object.keys(S).filter(k=>!D.some(r=>r.iso===k)&&(!pf||S[k].pl===pf)).map(k=>[{iso:k,...S[k],fm:null},S[k],'Ya no es elegible con el último avance'])];
 const A=[H,...U.map(([r,s,n])=>[r.iso,r.pl,r.un,r.pr,r.sp,r.mt,r.fm?dias(r):'',s.res||'Sin evaluar',s.coord||'',s.man||'',s.mtipo||'',s.sop||'',s.mat||'',s.desc||'',s.plat||'',s.and||'',s.nand?+s.nand:'',s.fsol||'',s.otro||'',s.sup||'',s.fecha||'',n,s.est||'',s.ftrab||'',s.flib||'',s.mont||''])];
 const P=[...new Set(U.map(x=>x[0].pr))].sort(),B=[['Prioridad','Total','Sin evaluar',...R],...P.map(p=>{const x=U.filter(y=>y[0].pr===p);return[p,x.length,x.filter(y=>!y[1].res).length,...R.map(k=>x.filter(y=>ef(y[1])===k).length)]})];

function cargar(buf,name){
 const w=XLSX.read(buf,{type:'array',cellDates:true}),sn=w.SheetNames.find(n=>/alineaci/i.test(n))||w.SheetNames[0];
 const A=XLSX.utils.sheet_to_json(w.Sheets[sn],{header:1,raw:true,defval:null}),hi=A.findIndex(r=>r&&r.includes('Isometrico')&&r.includes('Fecha de Montaje'));
 if(hi<0){alert('No encontré las columnas Isometrico y Fecha de Montaje. Elige el Excel del avance (hoja Alineacion).');return}
 const c=n=>A[hi].indexOf(n),ci={i:c('Isometrico'),p:c('Planta'),u:c('Unidad'),m:c('Mts'),r:c('Prioridad Base Iso'),fm:c('Fecha de Montaje'),fa:c('Fecha Alineacion')},T={};
 for(const r of A.slice(hi+1)){const k=r[ci.i];if(!has(k))continue;
  const t=T[k]||(T[k]={n:0,m:0,a:0,mt:0,fm:'',pl:r[ci.p],un:String(r[ci.u]),pr:r[ci.r]});
  t.n++;if(has(r[ci.fm])){t.m++;const d=ISO(r[ci.fm]);if(d>t.fm)t.fm=d}if(has(r[ci.fa]))t.a++;if(typeof r[ci.m]==='number')t.mt+=r[ci.m]}
 D=Object.keys(T).filter(k=>T[k].n===T[k].m&&T[k].a===0&&T[k].mt>6).map(k=>({iso:k,pl:T[k].pl,un:T[k].un,pr:T[k].pr,sp:T[k].n,mt:Math.round(T[k].mt*10)/10,fm:T[k].fm})).sort((x,y)=>(x.pr+x.fm+x.iso).localeCompare(y.pr+y.fm+y.iso));
 info='Avance: '+name;try{localStorage.setItem(K+'d',JSON.stringify(D));localStorage.setItem(K+'i',info)}catch(e){}
 const f=Object.keys(S).filter(k=>!D.some(r=>r.iso===k)).length;cur=null;a=null;msg='';tab='ev';draw();
 alert(D.length+' isométricos elegibles cargados.'+(f?' '+f+' evaluaciones guardadas ya no aplican; se conservan en el Excel.':''))}
