<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f3864"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Alineación"><link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--cd:#fff;--tx:#1b2330;--mu:#667085;--bd:#dde2ea;--ac:#1f3864;--on:#fff;--ok:#1e8e3e;--wa:#b26a00;--er:#c5221f;--bl:#1a5fb4;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--cd:#1a202a;--tx:#e8ebf0;--mu:#9aa4b2;--bd:#303846;--ac:#8ab4f8;--on:#11151c;--ok:#5bc27a;--wa:#f0b04a;--er:#f28b82;--bl:#8ab4f8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151c;--cd:#1a202a;--tx:#e8ebf0;--mu:#9aa4b2;--bd:#303846;--ac:#8ab4f8;--on:#11151c;--ok:#5bc27a;--wa:#f0b04a;--er:#f28b82;--bl:#8ab4f8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--cd);border-bottom:1px solid var(--bd)}

button,input,select,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:8px 14px}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box}
main{padding:14px 16px;max-width:1150px;margin:auto}
.g{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px}

.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px}
.li{padding:9px 10px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:8px}

.l{max-height:62vh;overflow:auto;margin-top:8px}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}.bl{color:var(--bl)}.mu{color:var(--mu)}
.q{font-size:19px;font-weight:600;margin:14px 0 4px}
.yn{display:flex;gap:10px;margin:12px 0}.yn button{flex:1;padding:14px;font-size:17px;font-weight:600}

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.f>*{flex:1 1 160px}
</style></head><body>
<header><h1>Evaluación de isométricos por alinear</h1>
<button id="t1" class="on">Evaluar</button><button id="t2">Dashboard</button><button id="t3">Programa</button><button id="ld">Cargar avance</button><button id="lsp">Cargar soportes</button><button id="im">Importar</button><button id="ex" class="p">Guardar en Excel</button><input id="fi" type="file" accept=".xlsx,.xlsm,.xls,.csv" hidden></header>
<div id="bx" class="c" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;box-shadow:0 4px 18px rgba(0,0,0,.35)"></div>
<main id="m"></main>
<script src="xlsx.full.min.js"></script>
<script>
let D=[],info='',pf='',sf='',AL=3,EQ=[],QD=[],pa=null,pd='',SP={},spi='';
const K='evalAlin1';let S={},sup='';
try{S=JSON.parse(localStorage.getItem(K)||'{}');sup=localStorage.getItem(K+'s')||'';D=JSON.parse(localStorage.getItem(K+'d')||'[]');info=localStorage.getItem(K+'i')||'';pf=localStorage.getItem(K+'p')||'';AL=+localStorage.getItem(K+'a')||3;EQ=JSON.parse(localStorage.getItem(K+'e')||'[]');QD=JSON.parse(localStorage.getItem(K+'q')||'[]')}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(K+'s',sup);localStorage.setItem(K+'e',JSON.stringify(EQ));localStorage.setItem(K+'q',JSON.stringify(QD))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=i=>document.getElementById(i);
const ef=s=>s.est||s.res;
const hoy=()=>new Date().toLocaleDateString('en-CA');
const dEv=s=>Math.floor((Date.now()-new Date(s.fecha+'T00:00'))/864e5);
const m1=v=>(+v).toLocaleString('es-MX',{maximumFractionDigits:1});
function lg(s,t){s.hist=s.hist||[];s.hist.push(hoy()+' · '+(sup||'—')+' · '+t);s.fmod=hoy()}
const ld=s=>[s.fecha,s.ftrab,s.flib,s.fmod].filter(Boolean).map(String).sort().pop()||'';
const fl=r=>(!pf||r.pl===pf)&&(!sf||(S[r.iso]&&ef(S[r.iso])===sf))&&(flt==='all'||(flt==='pend'?!S[r.iso]:flt==='work'?(S[r.iso]&&S[r.iso].res==='Trabajable'&&!S[r.iso].est):!!S[r.iso]));
let tab='ev',cur=null,a=null,flt='pend',q='',msg='';
const dias=r=>Math.max(0,Math.floor((Date.now()-new Date(r.fm+'T00:00'))/864e5));
const FL={mont:['mont'],coord:['coord'],man:['man','mtipo'],sop:['sop'],mat:['mat'],desc:['desc'],plat:['plat'],and:['and'],nand:['nand','fsol'],otro:['otro']};
function nq(a){
 if(!a.mont)return'mont';
 if(a.mont==='No')return null;
 if(!a.coord)return'coord';
 if(a.coord==='No'&&!a.man)return'man';
 if(!a.sop)return'sop';
 if(a.sop==='Sí'){if(!a.mat)return'mat';if(a.mat==='No')return a.desc?null:'desc'}
 if(!a.plat)return'plat';
 if(a.plat==='Sí')return null;
 if(!a.and)return'and';
 if(a.and==='Sí')return a.nand>0?null:'nand';
 return a.otro?null:'otro'}
function res(a){
 if(a.mont==='No')return'No alineable, Línea incompleta';
 if(a.sop==='Sí'&&a.mat==='No')return'No alineable por falta de material';
 if(a.plat==='Sí')return'Trabajable';
 if(a.and==='Sí')return a.fsol?'Pendiente por andamio':'Pendiente solicitud de andamio';
 return'Requiere otro medio de acceso'}
const CL={'Trabajable':'ok','No alineable, Línea incompleta':'er','Trabajado':'bl','Liberado':'ok','No alineable por falta de material':'er','Pendiente por andamio':'wa','Pendiente solicitud de andamio':'wa','Requiere otro medio de acceso':'bl'};
const QT={mont:['¿El isométrico está montado completo?','Confirma en campo que todos sus spools estén montados. Si falta alguno, queda como No alineable, Línea incompleta.'],coord:['¿El isométrico está en coordenada?','Sí = ya no requiere ningún recurso extra, como maniobra manual o grúa.'],
 man:['¿Requiere maniobra?',''],sop:['¿Requiere instalar soporte?',''],
 mat:['¿El soporte está en sitio o se cuenta con material para fabricarlo?',''],
 plat:['¿Se puede realizar con plataforma o es a nivel de piso?',''],and:['¿Requiere andamio?','']};
function ans(k,v){a[k]=v;a.h.push(k);draw()}
function back(){const k=a.h.pop();if(k)FL[k].forEach(f=>delete a[f]);draw()}
function nw(){a={h:[]};draw()}
function pick(i){cur=D[i];a=S[cur.iso]?null:{h:[]};msg='';draw()}
function done(k,fields){
 for(const f of fields){const v=$('f_'+f).value.trim();if(v)a[f]=v;else if(f!=='fsol'&&f!=='mtipo'){return}}
 if(k==='nand'&&!(+a.nand>0)){delete a.nand;return}
 a.h.push(k);draw()}
function est(k){const s=S[cur.iso],t=new Date().toLocaleDateString('en-CA'),e=m=>{msg='⚠ '+m;draw()};
 if(!sup)return e('Escribe tu nombre de supervisor.');
 if(k==='Trabajado'){if(s.res!=='Trabajable')return e('Solo se puede marcar Trabajado si el resultado es Trabajable. Reevalúa cuando ya tenga material o andamio.');s.est='Trabajado';s.ftrab=t;delete s.flib}
 else if(k==='Liberado'){if(!s.est)return e('Primero marca el isométrico como Trabajado.');s.est='Liberado';s.flib=t}
 else if(s.est==='Liberado'){s.est='Trabajado';delete s.flib}else{delete s.est;delete s.ftrab;if(s.pest==='Terminada')s.pest='En proceso'}
 lg(s,k==='back'?'Avance retrocedido':'Marcado '+k);sv();msg='Estatus actualizado.';draw()}
function cic(k){const s=S[cur.iso],e=m=>{msg='⚠ '+m;draw()};
 if(!sup)return e('Escribe tu nombre de supervisor.');
 if(k==='sol'){const f=$('f_fs').value||hoy();s.fsol=f;s.res='Pendiente por andamio';lg(s,'Andamio solicitado el '+f)}
 else if(k==='and'){s.res='Trabajable';lg(s,'Andamio instalado')}
 else if(k==='mat'){s.res='Trabajable';lg(s,'Material recibido')}
 else if(k==='acc'){s.res='Trabajable';lg(s,'Medio de acceso resuelto')}
 else{const t=$('f_nota').value.trim();s.nota=t;lg(s,t?'Nota: '+t:'Nota borrada')}
 sv();msg='Actualizado.';draw()}
function ext(s){const r=s.res;let h='';
 if(r==='Pendiente solicitud de andamio'&&!s.est)h+=(dEv(s)>=AL?'<p class="er">⚠ Lleva '+dEv(s)+' días sin solicitar andamio.</p>':'')+'<div class="f"><div><small class="mu">Fecha de solicitud (vacía = hoy)</small><input id="f_fs" type="date"></div></div><button class="p" onclick="cic(\'sol\')">Registrar solicitud de andamio</button>';
 else if(r==='Pendiente por andamio'&&!s.est)h+='<button class="p" onclick="cic(\'and\')">Andamio instalado</button>';
 else if(r==='No alineable por falta de material')h+='<button class="p" onclick="cic(\'mat\')">Material recibido</button>';
 else if(r==='Requiere otro medio de acceso')h+='<button class="p" onclick="cic(\'acc\')">Acceso resuelto</button>';
 h+='<div class="f"><div><small class="mu">Notas</small><textarea id="f_nota" rows="2" placeholder="Comentarios del isométrico">'+esc(s.nota||'')+'</textarea></div></div><button onclick="cic(\'nota\')">Guardar nota</button>';
 if(s.hist&&s.hist.length)h+='<div class="mu" style="margin:12px 0 4px">Historial</div><div class="tw"><table>'+s.hist.slice().reverse().map(x=>'<tr><td style="white-space:normal">'+esc(x)+'</td></tr>').join('')+'</table></div>';
 return h+'<div style="height:10px"></div>'}
function guardar(){
 if(!sup){msg='⚠ Escribe tu nombre de supervisor.';draw();return}
 const r=res(a);const o=S[cur.iso]||{};S[cur.iso]={...a,res:r,sup,fecha:hoy(),pl:cur.pl,un:cur.un,pr:cur.pr,sp:cur.sp,mt:cur.mt,nota:o.nota,hist:o.hist};lg(S[cur.iso],'Evaluado: '+r);sv();a=null;msg='Evaluación guardada.';draw()}
function panel(){
 if(!cur)return'<div class="c mu">'+(D.length?'Elige un isométrico de la lista. Solo aparecen los que están al 100 % de montaje, sin alineación y con más de 6 m.':'Aún no hay datos. Toca “Cargar avance” y elige el Excel del avance de montaje (hoja “Alineacion”). Se hace una vez con internet o con el archivo ya descargado; después funciona sin conexión.')+'</div>';
 let h='<div class="c"><b>'+esc(cur.iso)+'</b><div class="mu">'+esc(cur.pl)+' · Unidad '+esc(cur.un)+' · '+esc(cur.pr)+' · '+cur.sp+' spools · '+cur.mt+' m · '+dias(cur)+' días desde el último montaje</div>'+sblock(cur.iso);
 h+='<div class="f"><div><small class="mu">Supervisor</small><input id="sup" value="'+esc(sup)+'" placeholder="Nombre" oninput="sup=this.value;sv()"></div></div>';
 if(msg)h+='<p class="'+(msg[0]==='⚠'?'er':'ok')+'">'+esc(msg)+'</p>';
 const s=S[cur.iso];
 if(s&&!a){h+='<div class="q"><span class="b '+CL[ef(s)]+'">'+esc(ef(s))+'</span></div><p class="mu">Evaluado por '+esc(s.sup)+' el '+s.fecha+'.</p>'+det(s)+ext(s)+'<div class="yn" style="flex-wrap:wrap"><button onclick="est(\'Trabajado\')">Marcar Trabajado</button><button onclick="est(\'Liberado\')">Marcar Liberado</button>'+(s.est?'<button onclick="est(\'back\')">Quitar avance</button>':'')+'</div><button class="p" onclick="nw()">Reevaluar</button>';return h+'</div>'}
 const k=nq(a);
 if(k===null){const r=res(a);h+='<div class="q">Resultado</div><span class="b '+CL[r]+'" style="font-size:15px">'+esc(r)+'</span>'+det(a)+'<div class="yn"><button onclick="back()">Atrás</button><button class="p" onclick="guardar()">Guardar evaluación</button></div>'}
 else if(QT[k]){
  h+='<div class="q">'+QT[k][0]+'</div><div class="mu">'+QT[k][1]+'</div>'+hint(k);
  if(k==='man')h+='<div class="f"><div><small class="mu">Tipo de maniobra (opcional)</small><select id="f_mtipo"><option></option><option>Manual</option><option>Grúa</option><option>Manual y grúa</option></select></div></div>';
  h+='<div class="yn"><button onclick="'+(k==='man'?'a.mtipo=$(\'f_mtipo\').value;':'')+'ans(\''+k+'\',\'Sí\')">Sí</button><button onclick="'+(k==='man'?'a.mtipo=$(\'f_mtipo\').value;':'')+'ans(\''+k+'\',\'No\')">No</button></div>'+(a.h.length?'<button onclick="back()">Atrás</button>':'')}
 else if(k==='desc')h+='<div class="q">Describe el soporte que falta</div><textarea id="f_desc" rows="3" placeholder="Tipo de soporte, cantidad, material faltante"></textarea><div class="yn"><button onclick="back()">Atrás</button><button class="p" onclick="done(\'desc\',[\'desc\'])">Continuar</button></div>';
 else if(k==='nand')h+='<div class="q">Datos del andamio</div><div class="f"><div><small class="mu">¿Cuántos andamios se requieren?</small><input id="f_nand" type="number" min="1" step="1"></div><div><small class="mu">Fecha de solicitud (vacía = pendiente de solicitar)</small><input id="f_fsol" type="date"></div></div><div class="yn"><button onclick="back()">Atrás</button><button class="p" onclick="done(\'nand\',[\'nand\',\'fsol\'])">Continuar</button></div>';
 else h+='<div class="q">Describe el medio de acceso requerido</div><textarea id="f_otro" rows="3" placeholder="Ej. canastilla, grúa con canasta, escalera especial"></textarea><div class="yn"><button onclick="back()">Atrás</button><button class="p" onclick="done(\'otro\',[\'otro\'])">Continuar</button></div>';
 return h+'</div>'}
function det(s){const r=[['Montado completo',s.mont],['En coordenada',s.coord],['Maniobra',s.man?(s.man+(s.mtipo?' ('+s.mtipo+')':'')):'—'],['Requiere soporte',s.sop],['Soporte / material',s.mat||'—'],['Descripción del soporte',s.desc||'—'],['Plataforma o nivel de piso',s.plat||'—'],['Andamio',s.and?(s.and+(s.nand?' · '+s.nand+' pza(s)':'')+(s.fsol?' · solicitado '+s.fsol:'')):'—'],['Otro medio de acceso',s.otro||'—'],['Fecha trabajado',s.ftrab],['Fecha liberado',s.flib]];
 return'<div class="tw"><table>'+r.map(x=>'<tr><th>'+x[0]+'</th><td style="white-space:normal">'+esc(x[1]||'—')+'</td></tr>').join('')+'</table></div>'}
function sfOpts(){return'<option value="">Todos los estatus evaluados</option>'+Object.keys(CL).map(k=>'<option value="'+esc(k)+'"'+(k===sf?' selected':'')+'>'+esc(k)+' ('+D.filter(r=>S[r.iso]&&ef(S[r.iso])===k&&(!pf||r.pl===pf)).length+')</option>').join('')}
function goSf(k){sf=k;flt='all';tab='ev';cur=null;draw()}
function lista(){
 const L=D.map((r,i)=>[r,i]).filter(([r])=>fl(r)&&r.iso.toLowerCase().includes(q.toLowerCase()));
 return'<div class="c"><select id="pf" style="margin-bottom:8px" onchange="pf=this.value;try{localStorage.setItem(K+\'p\',pf)}catch(e){}draw()"><option value="">Todas las plantas</option>'+[...new Set(D.map(r=>r.pl))].sort().map(p=>'<option'+(p===pf?' selected':'')+'>'+esc(p)+'</option>').join('')+'</select><select id="sf" style="margin-bottom:8px" onchange="sf=this.value;if(sf)flt=\'all\';draw()">'+sfOpts()+'</select><input id="q" placeholder="Buscar isométrico" value="'+esc(q)+'" oninput="q=this.value;lst()"><div class="f" style="margin:8px 0 0"><button class="'+(flt==='pend'?'on':'')+'" onclick="flt=\'pend\';draw()">Sin evaluar</button><button class="'+(flt==='done'?'on':'')+'" onclick="flt=\'done\';draw()">Evaluados</button><button class="'+(flt==='work'?'on':'')+'" onclick="flt=\'work\';draw()">Por trabajar</button><button class="'+(flt==='all'?'on':'')+'" onclick="flt=\'all\';draw()">Todos</button></div><div class="mu" style="margin-top:6px">'+L.length+' isométricos'+(info?' · '+esc(info):'')+'</div><div class="l" id="ls">'+rows(L)+'</div></div>'}
function rows(L){return L.slice(0,300).map(([r,i])=>{const s=S[r.iso];return'<div class="li'+(cur&&cur.iso===r.iso?' s':'')+'" onclick="pick('+i+')"><b>'+esc(r.iso)+'</b><br><small>'+esc(r.pr)+' · '+r.mt+' m · '+dias(r)+' d'+(s?' · <span class="'+CL[ef(s)]+'">'+esc(ef(s))+'</span>':'')+(s&&s.res==='Pendiente solicitud de andamio'&&dEv(s)>=AL?' <span class="er">⚠ '+dEv(s)+' d</span>':'')+'</small></div>'}).join('')}
function lst(){const L=D.map((r,i)=>[r,i]).filter(([r])=>fl(r)&&r.iso.toLowerCase().includes(q.toLowerCase()));$('ls').innerHTML=rows(L)}
const V=()=>D.filter(r=>!pf||r.pl===pf);
function mu(){const x0=V(),sm=(x,f)=>x.filter(f).reduce((q,r)=>q+r.mt,0),g=r=>S[r.iso]||{},pt=r=>g(r).res==='Trabajable'&&!g(r).est,tr=r=>g(r).est==='Trabajado',lb=r=>g(r).est==='Liberado',row=(l,x)=>[l,x.length,sm(x,()=>1),sm(x,pt),sm(x,tr),sm(x,lb)];
 return[...[...new Set(x0.map(r=>r.un))].sort().map(u=>row(u,x0.filter(r=>r.un===u))),row('Total',x0)]}
function dash(){
 const ev=V().filter(r=>S[r.iso]),R=Object.keys(CL),n=k=>ev.filter(r=>ef(S[r.iso])===k).length,tot=V().length;
 const pa=ev.filter(r=>S[r.iso].and==='Sí'&&S[r.iso].plat==='No').reduce((s,r)=>s+(+S[r.iso].nand||0),0);
 const sa=ev.filter(r=>S[r.iso].res==='Pendiente solicitud de andamio'&&dEv(S[r.iso])>=AL);
 let h='<p class="mu">'+(pf?'Planta '+esc(pf):'Todas las plantas')+' · el filtro se cambia en la pestaña Evaluar</p><p class="mu">Alertar andamios sin solicitar a partir de <input type="number" min="1" value="'+AL+'" style="width:70px;display:inline" onchange="AL=Math.max(1,+this.value||3);try{localStorage.setItem(K+\'a\',AL)}catch(e){}draw()"> días</p><div class="kp"><div class="c"><span class="mu">Elegibles</span><b>'+tot+'</b></div><div class="c"><span class="mu">Evaluados</span><b>'+ev.length+'</b>'+Math.round(100*ev.length/(tot||1))+' %</div><div class="c"><span class="mu">Sin evaluar</span><b>'+(tot-ev.length)+'</b></div><div class="c ok"><span class="mu">Por trabajar</span><b>'+n('Trabajable')+'</b></div><div class="c er"><span class="mu">Sin material</span><b>'+n('No alineable por falta de material')+'</b></div><div class="c er"><span class="mu">Línea incompleta</span><b>'+n('No alineable, Línea incompleta')+'</b></div><div class="c wa"><span class="mu">Andamios requeridos</span><b>'+pa+'</b></div><div class="c bl"><span class="mu">Trabajados</span><b>'+n('Trabajado')+'</b></div><div class="c ok"><span class="mu">Liberados</span><b>'+n('Liberado')+'</b></div><div class="c er"><span class="mu">Andamios sin solicitar ≥ '+AL+' d</span><b>'+sa.length+'</b></div><div class="c er" style="cursor:pointer" onclick="tab=\'al\';draw()"><span class="mu">Soportes por instalar en alerta</span><b>'+alertas().length+'</b></div></div>';
