<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c120e"><title>Suite de supervisión</title>
<style>
:root{--bg:#0c120e;--s:#131a15;--s2:#1a241e;--bd:#233128;--tx:#f1f5f2;--mu:#8b9e91;--ac:#d4f542;--on:#0c120e;--ok:#4ade80;--wa:#facc15;--er:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eaedea;--s:#fff;--s2:#f1f4f0;--bd:#cbd5cb;--tx:#0c120e;--mu:#4e5f53;--ac:#111a14;--on:#d4f542;--ok:#15803d;--wa:#a16207;--er:#b91c1c;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--s);border-bottom:1px solid var(--bd)}
h1{margin:0;font-size:15px;font-weight:800}
main{max-width:1200px;margin:auto;padding:16px 20px}
.hd{display:flex;align-items:center;gap:10px}.hd h1{flex:1}
.bk{text-decoration:none;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-weight:800;font-size:12px;text-transform:uppercase;border:1px solid var(--ac);background:var(--ac);color:var(--on)}
header{position:sticky;top:0;z-index:20}
.sub{font-size:11px;color:var(--mu);font-weight:600}
.c{background:var(--s);border:1px solid var(--bd);padding:16px;margin-bottom:14px}
.mu{color:var(--mu)}.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kp .c{margin:0;border-top:3px solid var(--bd)}.kp .c.ok{border-top-color:var(--ok)}.kp .c.wa{border-top-color:var(--wa)}.kp .c.er{border-top-color:var(--er)}
.kp span{display:block;font-size:11px}.kp b{font:800 30px Consolas,monospace}
button{font-family:inherit;font-weight:700;font-size:12px;padding:10px 14px;min-height:44px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
.tw{overflow-x:auto;border:1px solid var(--bd);margin-top:10px}table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{background:var(--s2);color:var(--mu);font-size:11px}
td{font-family:Consolas,monospace}

.sr{display:flex;gap:8px;margin-bottom:14px}.sr input{flex:1;min-width:0;min-height:44px;font:16px inherit;padding:0 12px;background:var(--s);color:var(--tx);border:1px solid var(--bd)}
.sr input:focus{outline:1px solid var(--ac);border-color:var(--ac)}
.al{background:var(--s);border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px 14px;margin-bottom:14px}.al.on{border-left-color:var(--er)}
.al .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}.al .t b{font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.al a{color:var(--tx);font-weight:700}
.ch{display:inline-flex;gap:6px;align-items:baseline;margin:8px 8px 0 0;padding:6px 10px;border:1px solid var(--er);color:var(--tx);text-decoration:none;font-size:12px}.ch b{font:800 15px Consolas,monospace;color:var(--er)}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.tl{display:flex;flex-direction:column;padding:18px;background:var(--s);border:1px solid var(--bd);border-top:3px solid var(--ac);color:var(--tx);text-decoration:none;transition:background .15s}
.tl:hover{background:var(--s2)}.tl h2{margin:0;font-size:18px}.tl p{margin:2px 0 12px;color:var(--mu);font-size:12px}
.rw{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--bd);font-size:13px}.rw small{display:block;color:var(--mu);font-size:11px}
.rw b{font:800 24px Consolas,monospace}.rw b.z{color:var(--mu)}
.nd{padding:10px 0 4px;border-top:1px solid var(--bd);color:var(--mu);font-size:12px}
.go{margin-top:auto;padding-top:12px;font:700 11px Consolas,monospace;text-transform:uppercase;color:var(--ac)}
:root[data-theme=light] .go{color:var(--tx)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs a{flex:1 1 auto;text-align:center;padding:12px 16px;min-height:44px;background:var(--s);border:1px solid var(--bd);color:var(--mu);text-decoration:none;font-weight:700;font-size:12px;text-transform:uppercase}
.tabs a.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
@view-transition{navigation:auto}
::view-transition-group(root){animation-duration:.18s}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style></head><body>
<header><div class="hd" style="flex:1"><a id="bk" class="bk" href="#" style="display:none">← Suite</a><h1 id="tt">Suite de supervisión</h1></div><button id="th">Cambiar tema</button></header>
<main><div id="home"></div><div id="v"></div></main>
<script src="../xlsx.full.min.js"></script><script src="core.js"></script><script src="cambios.js"></script><script src="montaje.js"></script><script src="soportes.js"></script><script src="soldadura.js"></script><script src="paquetes.js"></script><script src="consulta.js"></script>
<script>
const $=i=>document.getElementById(i),E=Suite.esc,Mo=m=>Suite.mods.find(x=>x.id===m);
try{document.documentElement.dataset.theme=localStorage.getItem('evalAlin1_theme')||'dark'}catch(e){}
$('th').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;try{localStorage.setItem('evalAlin1_theme',t)}catch(e){}};
const fch=t=>((String(t||'').match(/(\d{4}-\d{2}-\d{2})/)||[])[1])||'',ob=o=>o&&Object.keys(o).length?Object.values(o):[];
/* Titulares: cada cifra sale de los datos ya cargados en cada módulo; si falta el dato se muestra "sin datos" */
function datos(){const S=Suite,r={};
 try{let T={};try{T=JSON.parse(localStorage.getItem('evalAlin1'))||{}}catch(e){}const v=Object.values(T);
  r.alin={ok:v.length>0,rows:[['Por trabajar',v.filter(x=>x.res==='Trabajable'&&!x.est).length],['Evaluados',v.length]],info:fch(localStorage.getItem('evalAlin1i')),T}}catch(e){r.alin={ok:false,rows:[]}}
 const md=ob(S.montaje.d),sd=ob(S.soportes.d),wd=ob(S.soldadura.d),M=S.montaje.d||{};
 r.mon={ok:md.length>0,n:md.filter(t=>t.e==='Oportunidad').length,f:fch(S.montaje.info)};
 r.sop={ok:sd.length>0,n:sd.filter(t=>S.soportes.cls(t)==='Instalar ahora').length,f:fch(S.soportes.info)};
 r.sol={ok:wd.length>0,n:wd.filter(x=>x.fw>x.fws&&M[S.cruce(x.iso)]&&M[S.cruce(x.iso)].e==='Montado').length,f:fch(S.soldadura.info)};
 let pq=[];try{if(S.paquetes.pk.length){S.paquetes.calc();pq=Object.values(S.paquetes.R)}}catch(e){}
 const pe=pq.filter(q=>!q.prob),c=e=>pe.filter(q=>q.e===e).length;
 r.pru={ok:pq.length>0,rows:[['Listos para entregar',c('Listo para entregar')],['Entregados, sin probar',c('Entregado, sin probar')],['Casi listas',c('Casi lista')]],f:fch(S.paquetes.info),ncp:pq.filter(q=>q.ncp>0).length};
 return r}
function alertas(d){const S=Suite,C=S.cambios,o=[];if(!C.ev.length)return null;
 try{o.push(['Alineación a reevaluar',C.alertas(d.alin.T||{}).length,'../index.html'])}catch(e){}
 try{const F={};ob(S.montaje.d).forEach(t=>{if(t.fm)F[t.k]=t.fm});o.push(['Montaje',C.alertasMod('montaje',F).length,'#construccion/montaje'])}catch(e){}
 try{const F={};ob(S.soportes.d).forEach(t=>{if(t.ult)F[t.k]=t.ult});o.push(['Soportes',C.alertasMod('soportes',F).length,'#construccion/soportes'])}catch(e){}
 try{const F={};ob(S.soldadura.d).forEach(x=>{if(x.last)F[S.cruce(x.iso)||x.iso]=x.last});o.push(['Soldadura',C.alertasMod('soldadura',F).length,'#construccion/soldadura'])}catch(e){}
 o.push(['Paquetes con NCD posterior a la prueba',d.pru.ncp||0,'#pruebas']);return o.filter(x=>x[1]>0)}
const rw=(l,v,f,ok)=>'<div class="rw"><span>'+E(l)+(f?'<small>datos al '+E(f)+'</small>':'')+'</span><b'+(ok&&v?'':' class="z"')+'>'+(ok?v:'—')+'</b></div>';
const tile=(h,n,desc,rows,info,ok,cta)=>'<a class="tl" href="'+h+'"><h2>'+E(n)+'</h2><p>'+E(desc)+'</p>'+rows+(ok?'':'<div class="nd">Sin datos cargados. Entra y carga el archivo.</div>')+(info?'<div class="nd">'+E(info)+'</div>':'')+'<div class="go">'+cta+' →</div></a>';
function home(){const d=datos(),A=alertas(d),C=Suite.cambios;
 let a;if(A===null)a='<div class="al"><div class="t"><b>Cambios de ingeniería</b><a href="#ncd">Cargar bitácora NCD</a></div><div class="mu">Sin bitácora cargada: los avisos de reevaluación no funcionan.</div></div>';
 else a='<div class="al'+(A.length?' on':'')+'"><div class="t"><b>Cambios de ingeniería</b><a href="#ncd">Ver detalle</a></div>'+(A.length?'<div>'+A.map(x=>'<a class="ch" href="'+x[2]+'"><b>'+x[1]+'</b> '+E(x[0])+'</a>').join('')+'</div>':'<div class="mu">Sin isométricos por revisar por NCD. '+E(C.info||'')+'</div>')+'</div>';
 $('home').innerHTML='<form class="sr" id="sf"><input id="sq" placeholder="Consultar isométrico · ej. AP-334065-01" autocomplete="off" enterkeyhint="search"><button class="p">Consultar</button></form>'+a+
 '<div class="tg">'+
 tile('../index.html','Alineación','Evaluación y programa de isométricos',d.alin.rows.map(r=>rw(r[0],r[1],'',d.alin.ok)).join(''),d.alin.info?'Avance al '+d.alin.info:'',d.alin.ok,'Abrir app')+
 tile('#construccion','Construcción','Montaje, soportes y soldadura: dónde hay oportunidad',rw('Montaje · isométricos en oportunidad',d.mon.n,d.mon.f,d.mon.ok)+rw('Soportes · listos para instalar',d.sop.n,d.sop.f,d.sop.ok)+rw('Soldadura · de sitio por soldar, ya montados',d.sol.n,d.sol.f,d.sol.ok),'',d.mon.ok||d.sop.ok||d.sol.ok,'Abrir')+
 tile('#pruebas','Pruebas hidrostáticas','Paquetes y qué les falta',d.pru.rows.map(r=>rw(r[0],r[1],'',d.pru.ok)).join(''),d.pru.f?'Datos al '+d.pru.f:'',d.pru.ok,'Abrir')+'</div>';
 $('sf').onsubmit=e=>{e.preventDefault();const v=$('sq').value.trim();if(v)location.hash='#consulta/'+encodeURIComponent(Suite.cruce(v)||v.toUpperCase())}}
function pantalla(r,p,el){
 if(r==='construccion'){const T=[['montaje','Montaje'],['soportes','Soportes'],['soldadura','Soldadura']],t=T.some(x=>x[0]===p)?p:'montaje';
  el.innerHTML='<div class="tabs">'+T.map(x=>'<a href="#construccion/'+x[0]+'" class="'+(x[0]===t?'on':'')+'">'+x[1]+'</a>').join('')+'</div><div id="cv"></div>';Mo(t).vista(el.querySelector('#cv'));return'Construcción'}
 if(r==='pruebas'){Mo('paquetes').vista(el);return'Pruebas hidrostáticas'}
 if(r==='ncd'){Mo('cambios').vista(el);return'Cambios de ingeniería'}
 if(r==='consulta'){Mo('consulta').vista(el);const q=el.querySelector('#q');if(p){q.value=decodeURIComponent(p);q.oninput()}return'Consulta por isométrico'}
 return null}
function render(){const h=(location.hash||'').slice(1).split('/'),el=$('v');el.innerHTML='';let t=null;
 try{t=pantalla(h[0],h[1],el)}catch(e){el.innerHTML='<div class="c er">No se pudo abrir esta sección: '+E(e.message)+'</div>';t='Error'}
 $('bk').style.display=t?'inline-flex':'none';$('home').style.display=t?'none':'block';el.style.display=t?'block':'none';
 $('tt').textContent=t||'Suite de supervisión';document.title=t?t+' · Suite':'Suite de supervisión';
 if(!t)home();window.scrollTo(0,0)}
const nav=()=>document.startViewTransition?document.startViewTransition(render):render();
addEventListener('hashchange',nav);
Promise.all(Suite.mods.filter(m=>m.cargar).map(m=>m.cargar())).then(render);
</script></body></html>
